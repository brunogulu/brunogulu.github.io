<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de turnos</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calendar-wrap">
        <div class="calendar">
            <div class="calendar_header">
                <h2 id="monthAndYear"></h2>
                <div class="nav">
                    <button type="button" id="switchLeft" aria-label="Mes anterior">
                        <svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/></svg>
                    </button>
                    <button type="button" id="switchRight" aria-label="Mes siguiente">
                        <svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/></svg>
                    </button>
                </div>
            </div>
            <div class="calendar_weekday">
                <div class="grid-weekday">Lun</div>
                <div class="grid-weekday">Mar</div>
                <div class="grid-weekday">Mié</div>
                <div class="grid-weekday">Jue</div>
                <div class="grid-weekday">Vie</div>
                <div class="grid-weekday">Sáb</div>
                <div class="grid-weekday">Dom</div>
            </div>
            <div class="calendar_content" id="calendarContent"></div>
            <div class="legend">
                <span class="legend-item day">D Día</span>
                <span class="legend-item night">N Noche</span>
                <span class="legend-item off">F Franco</span>
            </div>
        </div>
    </div>
    <script src="js/freeday.js"></script>
</body>
</html>
